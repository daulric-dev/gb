# Fixed project name so `docker compose` resolves the same project across all
# workflow steps (up / ps / logs / down), regardless of working directory.
name: gb

x-app: &app
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile
  # DATABASE_URL, S3_*, SMTP_*, AUTH_SECRET, FRONTEND_URL, etc. come from .env
  # (see env.example). The image applies `prisma migrate deploy` at start unless
  # MIGRATE_ON_START=false.
  env_file:
    - .env
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - appnet
  healthcheck:
    test:
      - CMD
      - bun
      - -e
      - "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 40s


x-app-env: &app-env
  USE_REDIS: "true"
  # REDIS_PASSWORD comes from infrastructure/.env (see env.example).
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
  # Chat DMs are always on and share USE_REDIS/REDIS_URL for pub/sub fan-out.
  # Multi-participant channels are gated off until the channel UI ships.
  CHAT_CHANNELS_ENABLED: "false"

services:
  # One-off release step when the app runs with MIGRATE_ON_START=false:
  #   docker compose --profile release run --rm migrate
  migrate:
    <<: *app
    profiles: ["release"]
    restart: "no"
    healthcheck:
      disable: true
    command: ["bunx", "prisma", "migrate", "deploy"]

  # Single-box deployments can run Postgres here instead of a managed database.
  # Uncomment, add `db: { condition: service_healthy }` to the app's
  # depends_on, the `db-data` volume below, and set
  # DATABASE_URL=postgresql://gradebook:${POSTGRES_PASSWORD}@db:5432/gradebook
  # db:
  #   image: postgres:18.6-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: gradebook
  #     POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}"
  #     POSTGRES_DB: gradebook
  #   volumes:
  #     - db-data:/var/lib/postgresql   # Postgres 18+: mount the parent folder
  #   networks:
  #     - appnet
  #   healthcheck:
  #     test: ["CMD", "pg_isready", "-U", "gradebook"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

  redis:
    image: redis:7.4-alpine
    # No published port: only the app replicas on appnet need Redis. It
    # carries chat pub/sub, presence, the cache and the job queue.
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in infrastructure/.env}"
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "no"
      - --requirepass
      - "${REDIS_PASSWORD:?Set REDIS_PASSWORD in infrastructure/.env}"
    volumes:
      - redis-data:/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5


networks:
  appnet:
    driver: bridge

volumes:
  redis-data:
  # db-data:
