# Fixed project name so `docker compose` resolves the same project across all
# workflow steps (up / ps / logs / down), regardless of working directory.
name: gb

x-app: &app
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile
  # DATABASE_URL, S3_*, SMTP_*, AUTH_SECRET, FRONTEND_URL, etc. come from .env
  # (see env.example). The image applies `prisma migrate deploy` at start unless
  # MIGRATE_ON_START=false.
  env_file:
    - .env
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - appnet
  healthcheck:
    test:
      - CMD
      - bun
      - -e
      - "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 40s


x-app-env: &app-env
  USE_REDIS: "true"
  # REDIS_PASSWORD comes from infrastructure/.env (see env.example).
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
  # Chat DMs are always on and share USE_REDIS/REDIS_URL for pub/sub fan-out.
  # Multi-participant channels are gated off until the channel UI ships.
  CHAT_CHANNELS_ENABLED: "false"

# WAL-G settings for the self-hosted `db` and `db-backup` services (used once
# they are uncommented). WAL-G reads the AWS_* names itself.
x-walg-env: &walg-env
  WALG_S3_PREFIX: "${WALG_S3_PREFIX:-}"
  AWS_ACCESS_KEY_ID: "${WALG_S3_ACCESS_KEY_ID:-}"
  AWS_SECRET_ACCESS_KEY: "${WALG_S3_SECRET_ACCESS_KEY:-}"
  AWS_REGION: "${WALG_S3_REGION:-us-east-1}"
  AWS_ENDPOINT: "${WALG_S3_ENDPOINT:-}"
  AWS_S3_FORCE_PATH_STYLE: "${WALG_S3_FORCE_PATH_STYLE:-}"
  WALG_LIBSODIUM_KEY: "${WALG_LIBSODIUM_KEY:-}"

services:
  # One-off release step when the app runs with MIGRATE_ON_START=false:
  #   docker compose --profile release run --rm migrate
  migrate:
    <<: *app
    profiles: ["release"]
    restart: "no"
    healthcheck:
      disable: true
    command: ["bunx", "prisma", "migrate", "deploy"]

  # Daily encrypted logical backup of the database (managed or self-hosted):
  # pg_dump | age -> BACKUP_S3_BUCKET at 04:00 (BACKUP_SCHEDULE, in BACKUP_TZ),
  # kept BACKUP_RETENTION_DAYS. Runs by default because backups are required:
  # until BACKUP_* is configured it exits with the reason and keeps
  # restarting. See infrastructure/BACKUPS.md.
  #   docker compose exec backup backup-now     # on-demand backup
  #   docker compose exec backup backup-list
  #   docker compose logs -f backup
  backup:
    build:
      context: ./backup
    image: gradebook-backup:local
    restart: unless-stopped
    # Only what the backup needs; the app's .env secrets are not passed in.
    environment:
      BACKUP_DATABASE_URL: "${BACKUP_DATABASE_URL:-${DATABASE_URL:-}}"
      BACKUP_S3_BUCKET: "${BACKUP_S3_BUCKET:-}"
      BACKUP_S3_PREFIX: "${BACKUP_S3_PREFIX:-postgres}"
      BACKUP_S3_ENDPOINT: "${BACKUP_S3_ENDPOINT:-}"
      BACKUP_S3_REGION: "${BACKUP_S3_REGION:-us-east-1}"
      BACKUP_S3_ACCESS_KEY_ID: "${BACKUP_S3_ACCESS_KEY_ID:-}"
      BACKUP_S3_SECRET_ACCESS_KEY: "${BACKUP_S3_SECRET_ACCESS_KEY:-}"
      BACKUP_S3_FORCE_PATH_STYLE: "${BACKUP_S3_FORCE_PATH_STYLE:-}"
      BACKUP_S3_STORAGE_CLASS: "${BACKUP_S3_STORAGE_CLASS:-}"
      BACKUP_AGE_RECIPIENTS: "${BACKUP_AGE_RECIPIENTS:-}"
      BACKUP_SCHEDULE: "${BACKUP_SCHEDULE:-0 4 * * *}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
      BACKUP_HEALTHCHECK_URL: "${BACKUP_HEALTHCHECK_URL:-}"
      TZ: "${BACKUP_TZ:-UTC}"
    read_only: true
    tmpfs:
      # Only ciphertext is written here (pg_dump streams into age). Size it
      # above the compressed dump, or mount a volume at /work for big databases.
      - /work:size=${BACKUP_TMPFS_SIZE:-2g},uid=70,gid=70,mode=0700
      - /run/backup:size=8m,uid=70,gid=70,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - appnet
    # With the self-hosted db below, also add:
    # depends_on:
    #   db: { condition: service_healthy }

  # Single-box deployments can run Postgres here instead of a managed database.
  # The image (infrastructure/postgres) is postgres:18.6-alpine plus WAL-G:
  # every WAL segment is archived, encrypted, to WALG_S3_PREFIX (continuous
  # backup / point-in-time recovery) and `db-backup` takes a base backup at
  # 04:00, keeping WALG_RETAIN_FULL of them. It is a drop-in replacement for
  # postgres:18.6-alpine on an existing volume (same musl libc and collation).
  # Uncomment `db`, `db-backup` and the `db-data` volume below, add
  # `db: { condition: service_healthy }` to the app's depends_on, set
  # POSTGRES_PASSWORD and the WALG_* variables, and
  # DATABASE_URL=postgresql://gradebook:${POSTGRES_PASSWORD}@db:5432/gradebook
  # db:
  #   build:
  #     context: ./postgres
  #   image: gradebook-postgres-walg:local
  #   restart: unless-stopped
  #   environment:
  #     <<: *walg-env
  #     POSTGRES_USER: gradebook
  #     POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}"
  #     POSTGRES_DB: gradebook
  #     # Seconds; at most about this much committed data is lost (BACKUPS.md).
  #     WALG_ARCHIVE_TIMEOUT: "${WALG_ARCHIVE_TIMEOUT:-60}"
  #   volumes:
  #     - db-data:/var/lib/postgresql   # Postgres 18+: mount the parent folder
  #   networks:
  #     - appnet
  #   healthcheck:
  #     test: ["CMD", "pg_isready", "-U", "gradebook"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #
  # # Base backups of `db`: same image, same volume mounted read-only.
  # #   docker compose exec db-backup walg-basebackup          # one now
  # #   docker compose exec db-backup walg backup-list --detail
  # db-backup:
  #   image: gradebook-postgres-walg:local
  #   restart: unless-stopped
  #   user: postgres
  #   command: ["walg-cron"]
  #   depends_on:
  #     db: { condition: service_healthy }
  #   environment:
  #     <<: *walg-env
  #     PGHOST: db
  #     PGUSER: gradebook
  #     PGDATABASE: gradebook
  #     PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}"
  #     WALG_BACKUP_SCHEDULE: "${WALG_BACKUP_SCHEDULE:-0 4 * * *}"
  #     WALG_RETAIN_FULL: "${WALG_RETAIN_FULL:-7}"
  #     WALG_HEALTHCHECK_URL: "${WALG_HEALTHCHECK_URL:-}"
  #     TZ: "${BACKUP_TZ:-UTC}"
  #   volumes:
  #     - db-data:/var/lib/postgresql:ro
  #   read_only: true
  #   tmpfs:
  #     - /run/walg:size=8m,uid=70,gid=70,mode=0700
  #     - /tmp:size=64m,uid=70,gid=70,mode=0700
  #   networks:
  #     - appnet
  #   healthcheck:
  #     test: ["CMD", "walg-health"]
  #     interval: 5m
  #     timeout: 10s
  #     retries: 1
  #     start_period: 5m

  redis:
    image: redis:7.4-alpine
    # No published port: only the app replicas on appnet need Redis. It
    # carries chat pub/sub, presence, the cache and the job queue.
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in infrastructure/.env}"
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "no"
      - --requirepass
      - "${REDIS_PASSWORD:?Set REDIS_PASSWORD in infrastructure/.env}"
    volumes:
      - redis-data:/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5


networks:
  appnet:
    driver: bridge

volumes:
  redis-data:
  # db-data:
