# Fixed project name so `docker compose` resolves the same project across all
# workflow steps (up / ps / logs / down), regardless of working directory.
name: gb

x-app: &app
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile
  # Supabase keys, FRONTEND_URL, NODE_ENV, etc. come from .env (see env.example).
  env_file:
    - .env
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
    clamav:
      condition: service_healthy
  networks:
    - appnet
  healthcheck:
    test:
      - CMD
      - bun
      - -e
      - "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 40s


x-app-env: &app-env
  USE_REDIS: "true"
  REDIS_URL: "redis://redis:6379"
  CLAMAV_HOST: "clamav"
  CLAMAV_PORT: "3310"
  # Chat DMs are always on and share USE_REDIS/REDIS_URL for pub/sub fan-out.
  # Multi-participant channels are gated off until the channel UI ships.
  CHAT_CHANNELS_ENABLED: "false"

services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  clamav:
    image: clamav/clamav:1.4
    # Image is amd64-only; force it so the stack also comes up on arm64 hosts.
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      # Persist signatures so freshclam doesn't re-download on every restart.
      - clamav-db:/var/lib/clamav
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 6
      # First boot downloads the signature database before clamd answers.
      start_period: 300s


networks:
  appnet:
    driver: bridge

volumes:
  redis-data:
  clamav-db:
