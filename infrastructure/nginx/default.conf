# Template: no compose file in this repo runs the API replicas (the hosting
# platform runs the image; see infrastructure/SERVICES.md). If you run them
# yourself, name the containers app1-app3: each listens on the image's
# default PORT, 3001, inside its own container.
upstream backend_load_balancer {
    server app1:3001;
    server app2:3001;
    server app3:3001;
    # Reuse upstream connections (needs proxy_http_version 1.1 + empty
    # Connection header, set on every location below).
    keepalive 32;
}

# Don't leak the nginx version in Server: headers or error pages.
server_tokens off;

# Shared proxy settings, reused by the HTTP and HTTPS servers below.
# X-Real-IP must be $remote_addr (the actual TCP peer), not $host
# (the attacker-controlled Host header) - downstream rate-limiting and
# audit logging key off this value.
#
# X-Forwarded-Proto is always nginx's own $scheme: a client-supplied header
# is never passed through (it would let anyone claim https). If TLS is
# terminated by a load balancer in front of nginx, trust only that hop:
# add `set_real_ip_from <LB CIDR>;` + `real_ip_header X-Forwarded-For;` and
# a `geo $realip_remote_addr $from_lb { default 0; <LB CIDR> 1; }` used by a
# map that picks $http_x_forwarded_proto only when $from_lb is 1.

server {
    listen 80;

    # Reject body uploads larger than the avatar/PDF cap. Without this,
    # default nginx 1MB limit would silently 413 valid 5MB uploads, and
    # an attacker could DoS the backend with unbounded payloads.
    client_max_body_size 16m;

    # Defense-in-depth security headers for every backend response (including
    # the chat stream). Declared at server level: a location with its own
    # add_header would drop these, so keep them here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    # Server-Sent Event streams: every API route ending in /stream
    # (/api/chat/stream, /api/portal/me/stream,
    # /api/attendance/sessions/:id/stream, ...). These connections are
    # long-lived and must not be buffered: with the default proxy_buffering on,
    # nginx would hold each event until its buffer filled, defeating realtime
    # delivery. The backend also emits `X-Accel-Buffering: no` as a
    # belt-and-braces signal. A regex location wins over the `/` prefix below.
    # Note: SSE only works against long-lived Node replicas, not the
    # Cloudflare Worker deploy target (which cannot hold a streaming response).
    location ~ ^/api/.+/stream$ {
        proxy_pass http://backend_load_balancer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        # Keep the stream open; SSE sends a heartbeat comment every 25s.
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Every HTTP method is proxied, including QUERY (the API's search and
    # filter lists send their filters in a QUERY body). Don't add
    # limit_except here, or those lists break.
    location / {
        proxy_pass http://backend_load_balancer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

