version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "staging"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "staging"
    groups:
      # CodeQL needs init, autobuild and analyze on the same version, so
      # they are bumped together in one pull request.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: "docker"
    directories:
      - "/infrastructure"
      - "/infrastructure/backup"
      - "/infrastructure/postgres"
    schedule:
      interval: "weekly"
    target-branch: "staging"
