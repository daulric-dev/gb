name: App Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  statuses: write

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    # Stripe's official API mock: the billing adapter's integration tests
    # (backend/src/billing/providers/stripe.mock.test.ts) run against it.
    services:
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports:
          - 12111:12111
    env:
      STRIPE_MOCK_URL: http://127.0.0.1:12111

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint & Test
        run: bunx turbo run lint test

      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - gbv2-frontend: lint"

      - name: Build
        run: bunx turbo run build

  gate:
    name: CI Gate
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "CI failed: build=${{ needs.build.result }}"
            exit 1
          fi
          echo "All checks passed"
