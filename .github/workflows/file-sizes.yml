name: Repository file sizes

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-sizes:
    name: File size report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bash .github/scripts/file-sizes-install-deps.sh

      - name: Build file size report
        run: bash .github/scripts/file-sizes-report.sh

      - name: Upload full report
        uses: actions/upload-artifact@v4
        with:
          name: file-size-report
          path: file-size-report.pdf
          if-no-files-found: warn
