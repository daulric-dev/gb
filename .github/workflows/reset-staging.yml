name: Reset staging branch

on:
  pull_request:
    types: [closed]
    branches:
      - main

# The ref update is made with the GH_TOKEN PAT, not GITHUB_TOKEN, so the
# workflow token only needs read access (for checkout).
permissions:
  contents: read

jobs:
  reset-staging:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'staging' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reset staging to main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/reset-staging.sh
