name: Security Scanning

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 6am UTC

permissions:
  contents: read

jobs:
  # 1. SCA - Dependency vulnerability scanning
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun audit
        run: bun audit

      # OSV-Scanner (Google). Report-only: there is no osv-scanner.toml
      # allowlist for accepted findings yet, so blocking would fail on
      # known/unfixable transitive advisories. Bun audit and Trivy gate instead.
      - name: Install OSV-Scanner
        run: bash .github/scripts/install-osv-scanner.sh

      - name: Run OSV-Scanner
        run: osv-scanner -r . --format table 2>&1 | tee osv-report.txt
        continue-on-error: true

      # Trivy filesystem scan: full CRITICAL+HIGH report, then a CRITICAL gate.
      - name: Run Trivy (filesystem report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Run Trivy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload dependency scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-scan-report
          path: |
            osv-report.txt
            trivy-report.txt
          retention-days: 30

  # 3. Secret Detection
  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # TruffleHog
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --only-verified

      # Full-history scan; fails the job when a verified secret is found.
      - name: Run TruffleHog (report file)
        if: always()
        run: bash .github/scripts/security-trufflehog-report.sh

      - name: Upload secret detection reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secrets-scan-report
          path: |
            results.sarif
            trufflehog-report.txt
          if-no-files-found: ignore
          retention-days: 30

  # 4. Snyk - Open-source vulnerability scan
  snyk:
    name: Snyk Scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Snyk CLI
        if: env.SNYK_TOKEN != ''
        run: bun add -g snyk@1.1308.3

      # Snyk stays report-only and is skipped when SNYK_TOKEN is not configured
      # (forks, Dependabot PRs).
      - name: Run Snyk (backend)
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: snyk test --file=backend/package.json --severity-threshold=high 2>&1 | tee snyk-backend-report.txt

      - name: Run Snyk (frontend)
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: snyk test --file=frontend/package.json --severity-threshold=high 2>&1 | tee snyk-frontend-report.txt

      - name: Upload Snyk reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snyk-report
          path: |
            snyk-backend-report.txt
            snyk-frontend-report.txt
          if-no-files-found: ignore
          retention-days: 30
