name: CodeQL

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          output: sarif-results
          upload: failure-only

      - name: Locate SARIF
        id: sarif
        run: |
          file=$(ls sarif-results/*.sarif | head -n 1)
          test -n "$file" || { echo "No SARIF produced"; exit 1; }
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Filter accepted exceptions
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            -backend/src/billing/providers/wipay.provider.ts:js/insufficient-password-hash
          input: ${{ steps.sarif.outputs.file }}
          output: ${{ steps.sarif.outputs.file }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.sarif.outputs.file }}
          category: "/language:javascript-typescript"
