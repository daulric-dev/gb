<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Your GradeBook sign-in code</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f5f5f5;">
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0;">
      Your GradeBook sign-in code is {{ .Token }}
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f5f5f5;">
      <tr>
        <td align="center" style="padding: 32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 460px; background-color: #ffffff; border: 1px solid #e5e5e5; border-radius: 16px;">
            <tr>
              <td style="padding: 40px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="padding-left: 12px;">
                      <div style="font-size: 18px; font-weight: 700; color: #0a0a0a;">GradeBook</div>
                      <div style="font-size: 11px; color: #a3a3a3;">by daulric.dev</div>
                    </td>
                  </tr>
                </table>

                <h1 style="margin: 28px 0 6px 0; font-size: 22px; font-weight: 700; color: #0a0a0a;">Your sign-in code</h1>
                <p style="margin: 0 0 24px 0; font-size: 14px; line-height: 20px; color: #737373;">
                  Enter this 8-digit code in the app to finish signing in. It
                  expires shortly and can only be used once.
                </p>

                <div style="font-size: 34px; font-weight: 700; letter-spacing: 10px; color: #0a0a0a; background-color: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 12px; padding: 18px 0; text-align: center;">
                  {{ .Token }}
                </div>
              </td>
            </tr>
          </table>

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 460px;">
            <tr>
              <td style="padding: 20px 40px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; line-height: 18px; color: #a3a3a3;">
                If you didn't try to sign in, you can safely ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
