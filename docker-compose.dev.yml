name: gb

services:
  # The application database. Connection string in backend/.env:
  # postgresql://gradebook:gradebook@127.0.0.1:5432/gradebook
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gradebook
      POSTGRES_PASSWORD: gradebook
      POSTGRES_DB: gradebook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data in a versioned folder under this path.
      - db-data-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gradebook"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      # Loopback only, so the unauthenticated dev Redis isn't on the network.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # S3-compatible object storage for development (SeaweedFS). The API
  # talks to it like any S3: endpoint http://127.0.0.1:8333, key gradebook /
  # gradebook-secret (infrastructure/dev/s3.json). The API creates its bucket
  # on first use in development.
  s3:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=0"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3-data:/data
      - ./infrastructure/dev/s3.json:/etc/seaweedfs/s3.json:ro

  # Catches outgoing email (sign-in codes). Inbox on http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  # Postgres 18. The old 17 volume (`gb_db-data`) is left untouched; remove it
  # with `docker volume rm gb_db-data` once you no longer need it.
  db-data-18:
  redis-data:
  s3-data:
