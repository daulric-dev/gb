name: gb

services:
  # The application database. Connection string in backend/.env:
  # postgresql://gradebook:gradebook@127.0.0.1:5432/gradebook
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gradebook
      POSTGRES_PASSWORD: gradebook
      POSTGRES_DB: gradebook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data in a versioned folder under this path.
      - db-data-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gradebook"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      # Loopback only, so the unauthenticated dev Redis isn't on the network.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # S3-compatible object storage for development (SeaweedFS). The API
  # talks to it like any S3: endpoint http://127.0.0.1:8333, key gradebook /
  # gradebook-secret (infrastructure/dev/s3.json). The API creates its bucket
  # on first use in development.
  s3:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=0"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3-data:/data
      - ./infrastructure/dev/s3.json:/etc/seaweedfs/s3.json:ro

  # Stripe's official mock of its API, for testing billing without a Stripe
  # account or network. Point the API at it with
  # STRIPE_API_BASE=http://127.0.0.1:12111 (any sk_test_ key works). It is
  # stateless and sends no webhooks: tests sign their own (see
  # backend/src/billing/STRIPE.md, "Testing with stripe-mock").
  stripe-mock:
    image: stripe/stripe-mock:v0.206.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:12111:12111"

  # Catches outgoing email (sign-in codes). Inbox on http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # --- Optional: backups (infrastructure/BACKUPS.md) -------------------------
  # Not started by default. Create the bucket once, then run a backup:
  #   docker compose -f docker-compose.dev.yml --profile backup run --rm \
  #     -e BACKUP_S3_NO_CHECK_BUCKET=false backup backup-rclone mkdir backup:gradebook-backups
  #   docker compose -f docker-compose.dev.yml --profile backup run --rm backup backup-now
  # Encryption is required: put an age public key in BACKUP_AGE_RECIPIENTS
  # (shell or a root .env), or BACKUP_ALLOW_UNENCRYPTED=true for a local test.
  backup:
    profiles: ["backup"]
    build: ./infrastructure/backup
    image: gradebook-backup:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      BACKUP_DATABASE_URL: postgresql://gradebook:gradebook@db:5432/gradebook
      BACKUP_S3_ENDPOINT: http://s3:8333
      BACKUP_S3_BUCKET: gradebook-backups
      BACKUP_S3_PREFIX: postgres
      BACKUP_S3_ACCESS_KEY_ID: gradebook
      BACKUP_S3_SECRET_ACCESS_KEY: gradebook-secret
      BACKUP_AGE_RECIPIENTS: "${BACKUP_AGE_RECIPIENTS:-}"
      BACKUP_ALLOW_UNENCRYPTED: "${BACKUP_ALLOW_UNENCRYPTED:-false}"
      BACKUP_SCHEDULE: "${BACKUP_SCHEDULE:-0 4 * * *}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
      # backup-verify restores into a throwaway database on the dev server.
      BACKUP_VERIFY_DATABASE_URL: postgresql://gradebook:gradebook@db:5432/postgres
      TZ: "${BACKUP_TZ:-UTC}"
    read_only: true
    tmpfs:
      - /work:size=1g,uid=70,gid=70,mode=0700
      - /run/backup:size=8m,uid=70,gid=70,mode=0700

  # A second, separate Postgres with WAL-G continuous archiving (port 5433,
  # own volume) for trying point-in-time recovery. The default `db` above is
  # not changed. Needs a key: WALG_LIBSODIUM_KEY=$(openssl rand -hex 32).
  #   WALG_LIBSODIUM_KEY=... docker compose -f docker-compose.dev.yml --profile walg up -d --build
  db-walg:
    profiles: ["walg"]
    build: ./infrastructure/postgres
    image: gradebook-postgres-walg:local
    restart: unless-stopped
    depends_on:
      s3:
        condition: service_started
    environment: &dev-walg-env
      POSTGRES_USER: gradebook
      POSTGRES_PASSWORD: gradebook
      POSTGRES_DB: gradebook
      WALG_S3_PREFIX: s3://gradebook-backups/wal-g
      AWS_ACCESS_KEY_ID: gradebook
      AWS_SECRET_ACCESS_KEY: gradebook-secret
      AWS_ENDPOINT: http://s3:8333
      AWS_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
      WALG_LIBSODIUM_KEY: "${WALG_LIBSODIUM_KEY:-}"
      WALG_ARCHIVE_TIMEOUT: "60"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-walg-data-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gradebook"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-walg-backup:
    profiles: ["walg"]
    image: gradebook-postgres-walg:local
    restart: unless-stopped
    user: postgres
    command: ["walg-cron"]
    depends_on:
      db-walg:
        condition: service_healthy
    environment:
      <<: *dev-walg-env
      PGHOST: db-walg
      PGUSER: gradebook
      PGPASSWORD: gradebook
      PGDATABASE: gradebook
      WALG_BACKUP_SCHEDULE: "0 4 * * *"
      WALG_RETAIN_FULL: "7"
    volumes:
      - db-walg-data-18:/var/lib/postgresql:ro
    healthcheck:
      test: ["CMD", "walg-health"]
      interval: 1m
      timeout: 10s
      retries: 1
      start_period: 2m

volumes:
  # Postgres 18. The old 17 volume (`gb_db-data`) is left untouched; remove it
  # with `docker volume rm gb_db-data` once you no longer need it.
  db-data-18:
  redis-data:
  s3-data:
  # Only used by the optional `walg` profile.
  db-walg-data-18:
